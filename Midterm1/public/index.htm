<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Quản Lý Sản Phẩm</h1>
        <button id="logout-button" class="logout-button">Đăng Xuất</button>
    </header>
    <main>
        <section class="table-section">
            <h2>Danh Sách Sản Phẩm</h2>
            <button id="add-product-button">Thêm Sản Phẩm</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Hình ảnh</th>
                        <th>Mô tả</th>
                        <th>Danh mục</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </section>
    </main>
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2 id="modal-title">Chi Tiết Sản Phẩm</h2>
            <form id="modal-form">
                <input type="hidden" id="modal-product-id">
                <div class="form-group">
                    <label for="modal-name">Tên sản phẩm</label>
                    <input type="text" id="modal-name" placeholder="Tên sản phẩm" required>
                </div>
                <div class="form-group">
                    <label for="modal-price">Giá</label>
                    <input type="number" id="modal-price" placeholder="Giá" required>
                </div>
                <div class="form-group">
                    <label for="modal-image">URL Hình ảnh</label>
                    <input type="text" id="modal-image" placeholder="URL Hình ảnh" required>
                </div>
                <div class="form-group">
                    <label for="modal-description">Mô tả sản phẩm</label>
                    <textarea id="modal-description" placeholder="Mô tả sản phẩm"></textarea>
                </div>
                <div class="form-group">
                    <label for="modal-category">Danh mục</label>
                    <select id="modal-category" required>
                        <option value="Pizza">Pizza</option>
                        <option value="Khai vị">Khai vị</option>
                        <option value="Mỳ Ý">Mỳ Ý</option>
                        <option value="Salad">Salad</option>
                        <option value="Thức uống">Thức uống</option>
                    </select>
                </div>
                <button type="submit" id="modal-submit-button">Thêm</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="logout.js"></script> 
</body>
</html>
