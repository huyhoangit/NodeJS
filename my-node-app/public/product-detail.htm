<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Chi Tiết Sản Phẩm</h1>
    </header>
    <main>
        <div id="product-detail" class="product-detail-container">
            <img id="product-image" src="" alt="Hình ảnh sản phẩm" class="product-image">
            <div class="product-info">
                <h2 id="product-name"></h2>
                <p id="product-price" class="product-price"></p>
                <p id="product-description" class="product-description"></p>
                <p id="product-category" class="product-category"></p>
                <button id="back-button">Quay Lại</button>
            </div>
        </div>
    </main>
    <script src="product-detail.js"></script>
</body>

</html>
